services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blood_supply
      POSTGRES_USER: blood_user
      POSTGRES_PASSWORD: blood_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blood_user -d blood_supply"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://blood_user:blood_password@postgres:5432/blood_supply
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
